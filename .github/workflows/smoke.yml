name: Docker smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Production image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voicebot
          POSTGRES_PASSWORD: voicebot
          POSTGRES_DB: voicebot_regression_2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voicebot -d voicebot_regression_2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMOKE_DATABASE_URL: postgresql://voicebot:voicebot@localhost:5432/voicebot_regression_2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build production image
        run: docker build --tag voicebot:smoke .
      - name: Check packaged application against PostgreSQL
        run: >-
          docker run --rm --network host
          --env SMOKE_DATABASE_URL
          --volume "$PWD/scripts:/app/scripts:ro"
          voicebot:smoke node scripts/smoke.mjs
